name: ChaosForge - Auth check and deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Acción a ejecutar"
        type: choice
        options:
          - verify-auth
          - deploy
          - deploy-admin
          - destroy
        default: verify-auth
        required: true
      approval:
        description: "Para deploy: CREAR. Para deploy-admin: ADMIN. Para destroy: DESTRUIR. verify-auth no requiere texto."
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: chaosforge-gcp-lab
  cancel-in-progress: false

# Nada de la cuenta está escrito aquí: scripts/bootstrap.sh publica estas
# variables del repositorio (Settings -> Secrets and variables -> Actions -> Variables).
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  CLUSTER: chaosforge-lab
  STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}

jobs:
  verify-auth:
    name: Verify GitHub OIDC authentication
    runs-on: ubuntu-latest
    steps:
      - name: Check repository variables published by scripts/bootstrap.sh
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          missing=0
          for name in PROJECT_ID STATE_BUCKET WIF_PROVIDER DEPLOY_SA; do
            if [[ -z "${!name}" ]]; then echo "::error::Falta la variable del repositorio para $name. Ejecuta scripts/bootstrap.sh."; missing=1; fi
          done
          exit "$missing"

      - name: Authenticate with Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token

      - name: Confirm temporary credential was issued
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          test -n "$ACCESS_TOKEN"
          echo "OIDC authentication succeeded; temporary access token issued."
          echo "No infrastructure created."

  deploy:
    name: Deploy infrastructure and Online Boutique
    needs: verify-auth
    if: ${{ inputs.mode == 'deploy' && inputs.approval == 'CREAR' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: gcp-lab
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout ChaosForge
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up gcloud (including GKE auth plugin)
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Terraform format
        run: terraform -chdir=infrastructure/terraform fmt -check

      - name: Terraform init and validate
        run: |
          terraform -chdir=infrastructure/terraform init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform -chdir=infrastructure/terraform validate

      - name: Terraform plan
        run: terraform -chdir=infrastructure/terraform plan -input=false -out=lab.tfplan

      - name: Terraform apply (billable)
        run: terraform -chdir=infrastructure/terraform apply -input=false lab.tfplan

      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials "$CLUSTER" \
            --region="$REGION" --project="$PROJECT_ID"

      - name: Deploy Online Boutique
        run: bash ./scripts/deploy-boutique.sh

      - name: Check deployed resources
        run: kubectl -n boutique get pods,services

  deploy-admin:
    name: Build and deploy private ChaosForge administrator
    needs: verify-auth
    if: ${{ inputs.mode == 'deploy-admin' && inputs.approval == 'ADMIN' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: gcp-lab
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_REPOSITORY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/chaosforge/chaosforge-admin
    steps:
      - uses: actions/checkout@v4
      - name: Required checks before publishing or deployment
        uses: ./.github/actions/check-admin
      - name: Build and test image on the GitHub runner (no Cloud Build)
        run: |
          IMAGE_TAG="$IMAGE_REPOSITORY:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --tag "$IMAGE_TAG" admin
          docker run --rm --entrypoint python \
            --mount "type=bind,source=$PWD/admin/tests,target=/app/tests,readonly" \
            "$IMAGE_TAG" -m unittest discover -s tests -v
      - name: Authenticate through existing GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Connect and check existing administrator is idle
        run: |
          gcloud container clusters get-credentials "$CLUSTER" --region="$REGION" --project="$PROJECT_ID"
          EXISTING_ADMIN="$(kubectl -n chaosforge-system get deployment chaosforge-admin -o name --ignore-not-found)"
          if [[ -n "$EXISTING_ADMIN" ]]; then
            bash scripts/verify-admin.sh --idle-only
          fi
      - name: Publish tested image and resolve immutable digest
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker push "$IMAGE_TAG"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project="$PROJECT_ID" --format='value(image_summary.digest)')"
          IMAGE_REF="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          python admin/render_manifest.py "$IMAGE_REF" > "$RUNNER_TEMP/chaosforge-admin.yaml"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
      - name: Deploy only administrator resources
        run: bash scripts/deploy-admin.sh "$IMAGE_REF"
      - name: Verify private access, PVC, real reads and effective permissions
        run: bash scripts/verify-admin.sh
      - name: Record deployed revision
        run: |
          {
            echo '### ChaosForge administrator'
            echo "Commit: $GITHUB_SHA"
            echo "Image: $IMAGE_REF"
            echo 'Namespace: chaosforge-system; access: private port-forward.'
            echo 'Read-only checks passed. No fault injection was performed.'
            echo 'Open locally: kubectl -n chaosforge-system port-forward --address 127.0.0.1 service/chaosforge-admin 8093:8081 8092:8080 (panel http://127.0.0.1:8093; Tider observer http://127.0.0.1:8092)'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy lab infrastructure (stops charges)
    needs: verify-auth
    if: ${{ inputs.mode == 'destroy' && inputs.approval == 'DESTRUIR' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: gcp-lab
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Remove workloads first so their load balancers do not block the VPC
        run: |
          if gcloud container clusters describe "$CLUSTER" --region="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1; then
            gcloud container clusters get-credentials "$CLUSTER" --region="$REGION" --project="$PROJECT_ID"
            kubectl delete namespace boutique --ignore-not-found --wait --timeout=600s
          else
            echo 'Cluster not found; nothing to clean inside Kubernetes.'
          fi
      - name: Terraform destroy
        run: |
          terraform -chdir=infrastructure/terraform init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform -chdir=infrastructure/terraform destroy -input=false -auto-approve
      - name: Summary
        run: |
          {
            echo '### ChaosForge lab destroyed'
            echo 'Cluster, subnet and VPC removed. The state bucket, the image repository and the'
            echo 'deployment identity remain (created by scripts/bootstrap.sh); they cost close to nothing.'
            echo 'The administrator history (PVC) was deleted with the cluster.'
          } >> "$GITHUB_STEP_SUMMARY"
