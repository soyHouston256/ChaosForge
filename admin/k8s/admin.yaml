apiVersion: v1
kind: Namespace
metadata:
  name: chaosforge-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaosforge-admin
  namespace: chaosforge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaosforge-admin
  namespace: boutique
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [cartservice, paymentservice, productcatalogservice, shippingservice, currencyservice, recommendationservice, frontend, redis-cart, checkoutservice, emailservice, adservice, loadgenerator]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [cartservice, paymentservice, productcatalogservice, shippingservice, currencyservice, recommendationservice, frontend, redis-cart, checkoutservice, emailservice, adservice, loadgenerator]
    verbs: [patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaosforge-admin
  namespace: boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaosforge-admin
subjects:
  - kind: ServiceAccount
    name: chaosforge-admin
    namespace: chaosforge-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaosforge-state
  namespace: chaosforge-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaosforge-admin
  namespace: chaosforge-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chaosforge-admin
  template:
    metadata:
      labels:
        app: chaosforge-admin
    spec:
      serviceAccountName: chaosforge-admin
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: CHAOSFORGE_ADMIN_IMAGE
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 100Mi
          volumeMounts:
            - name: state
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: chaosforge-state
---
apiVersion: v1
kind: Service
metadata:
  name: chaosforge-admin
  namespace: chaosforge-system
spec:
  type: ClusterIP
  selector:
    app: chaosforge-admin
  ports:
    - port: 8080
      targetPort: 8080
---
# No network ingress. kubectl port-forward uses the authenticated API/kubelet tunnel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-admin
  namespace: chaosforge-system
spec:
  podSelector:
    matchLabels:
      app: chaosforge-admin
  policyTypes: [Ingress]
  ingress: []
