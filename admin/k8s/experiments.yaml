# Opt-in preparation only. Not applied by deploy-admin.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaosforge-experiments
  namespace: boutique
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [cartservice]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [chaosforge-proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaosforge-experiments
  namespace: boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaosforge-experiments
subjects:
  - kind: ServiceAccount
    name: chaosforge-admin
    namespace: chaosforge-system
---
# Begin with one mechanism. Enable latency only after proxy preparation and
# CPU only after validating Monitoring access and calibrating the workload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaosforge-experiments
  namespace: chaosforge-system
data:
  mechanisms: wrong_port
